name: Deploy SDK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CI: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true
  NODE_OPTIONS: "--no-deprecation"

jobs:
  deploy:
    name: Deploy SDK (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        include:
          - os: ubuntu-latest
            name: linux
            preset: linux-clang
            config_preset: linux-clang
          - os: windows-latest
            name: windows
            preset: windows-clang
            config_preset: windows-clang

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Get CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Setup Compiler Cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          variant: ${{ matrix.os == 'windows-latest' && 'sccache' || 'ccache' }}
          key: ${{ runner.os }}-${{ matrix.config_preset }}
          max-size: 5G

      - name: Get current version/date
        id: info
        shell: bash
        run: |
          echo "date=$(date +'%d.%m.%y')" >> $GITHUB_OUTPUT
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=${TAG_VERSION:-manual}" >> $GITHUB_OUTPUT

      - name: Setup environment
        id: build-env
        shell: bash
        run: |
          mkdir -p build/${{ matrix.preset }}
          mkdir -p package/bin
          echo "package-dir=$(pwd)/package" >> $GITHUB_OUTPUT

      - name: Install dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build ccache \
            libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libasound2-dev libglu1-mesa-dev \
            libwayland-dev libxkbcommon-dev libegl1-mesa-dev \
            pkg-config libgtk-3-dev libdrm-dev libgbm-dev \
            xvfb libxkbcommon-x11-0 clang lld

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install jinja2

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        env:
          NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
        with:
          dotnet-version: '9.0.x'
          cache: true
          cache-dependency-path: '**/packages.lock.json'
          cache-packages-path: ${{ github.workspace }}/.nuget/packages

      - name: Setup MSYS2
        if: matrix.os == 'windows-latest'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-clang lld

      - name: Configure CMake
        run: |
          set -euo pipefail
          PYTHON_EXE=$(python -c "import sys; print(sys.executable)")
          extra_flags=""
          launcher="sccache"
          if [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            launcher="ccache"
          fi

          cmake --preset ${{ matrix.preset }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=$launcher \
            -DCMAKE_CXX_COMPILER_LAUNCHER=$launcher \
            -DCMAKE_INSTALL_PREFIX="${{ steps.build-env.outputs.package-dir }}" \
            -DPython_EXECUTABLE="${PYTHON_EXE}" \
            -DPython3_EXECUTABLE="${PYTHON_EXE}" \
            -DCH_CI=ON \
            -DENABLE_UNITY_BUILD=ON \
            -DENABLE_PCH=OFF \
            -DBUILD_TESTS=OFF \
            $extra_flags

      - name: Build binaries
        run: |
          set -euo pipefail
          cmake --build --preset ${{ matrix.preset }} \
            --target ChainedEditor ChainedRuntime \
            --parallel $(nproc 2>/dev/null || echo 8) \
            2>&1 | tee "build/${{ matrix.preset }}/build.log"

      - name: Install to package directory
        shell: bash
        run: |
          cmake --install build/${{ matrix.preset }} \
            --component Runtime

      - name: Package SDK
        shell: bash
        run: |
          cd "${{ steps.build-env.outputs.package-dir }}"
          # Exact naming from screenshot: Chained Engine(Chained Decos) SDK DD.MM.YY
          PACKAGE_NAME="Chained Engine(Chained Decos) SDK ${{ steps.info.outputs.date }}"
          echo "Creating SDK package: $PACKAGE_NAME"
          
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            powershell -Command "
              Compress-Archive -Path '*' -DestinationPath '${{ steps.build-env.outputs.package-dir }}/$PACKAGE_NAME.zip' -Force
            "
            echo "p-file=$PACKAGE_NAME.zip" >> $GITHUB_ENV
          else
            tar -czf "$PACKAGE_NAME.tar.gz" .
            echo "p-file=$PACKAGE_NAME.tar.gz" >> $GITHUB_ENV
          fi

      - name: Create Release
        if: matrix.os == 'ubuntu-latest'
        uses: softprops/action-gh-release@v2
        with:
          name: "Chained Engine(Chained Decos) SDK ${{ steps.info.outputs.date }}"
          tag_name: "release-sdk-${{ steps.info.outputs.date }}"
          files: |
            package/*.zip
            package/*.tar.gz
          body: |
            ### Chained Engine SDK Update
            - **Version**: ${{ steps.info.outputs.version }}
            - **Build Date**: ${{ steps.info.outputs.date }}
            - **Architecture**: ${{ matrix.os }} / ${{ matrix.preset }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
