name: CI

on:
  push:
    branches: [main, develop]
    paths:
      - "**/*.cpp"
      - "**/*.h"
      - "**/*.cs"
      - "**/*.csproj"
      - "**/CMakeLists.txt"
      - "**/CMakePresets.json"
      - "cmake/*.cmake"
      - ".github/workflows/*.yml"
  pull_request:
    branches: [main, develop, chained-gui, refactor-branch]
    paths:
      - "**/*.cpp"
      - "**/*.h"
      - "**/*.cs"
      - "**/*.csproj"
      - "**/CMakeLists.txt"
      - "**/CMakePresets.json"
      - "cmake/*.cmake"
      - ".github/workflows/*.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  native:
    name: Native Builds
    uses: ./.github/workflows/ci-native-reusable.yml
    secrets: inherit

  managed-tests:
    name: Managed Scripts Tests
    uses: ./.github/workflows/ci-managed-reusable.yml
    secrets: inherit

  quality-gate:
    name: PR Gate
    runs-on: ubuntu-latest
    needs: [native, managed-tests]
    steps:
      - run: echo "Native builds and managed tests passed."