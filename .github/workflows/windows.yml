name: Windows

on:
  workflow_call:

env:
  CI: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true
  NODE_OPTIONS: "--no-deprecation"

jobs:
  build-windows:
    name: build (windows-latest, ${{ matrix.build_type }}, ${{ matrix.compiler }})
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: windows-clang
            compiler: clang
            build_type: Release
            unity_build: ON
          - preset: windows-clang
            compiler: clang
            build_type: Debug
            unity_build: ON
          - preset: windows-msvc
            compiler: cl
            build_type: Release
            unity_build: ON
          - preset: windows-msvc
            compiler: cl
            build_type: Debug
            unity_build: ON
          - preset: windows-gcc
            compiler: gcc
            build_type: Release
            unity_build: ON
          - preset: windows-gcc
            compiler: gcc
            build_type: Debug
            unity_build: ON
          

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Write submodule SHA manifest
        run: git submodule status | tee submodule-shas.txt

      - name: Cache submodules
        uses: actions/cache@v4
        with:
          path: |
            .git/modules
            thirdparty
          key: submodules-${{ runner.os }}-${{ hashFiles('submodule-shas.txt') }}
          restore-keys: |
            submodules-${{ runner.os }}-

      - name: Init submodules
        run: git submodule update --init --recursive --depth 1

      - name: Setup MSYS2
        if: "contains(matrix.preset, 'clang') && !contains(matrix.preset, 'msvc') || contains(matrix.preset, 'gcc') && !contains(matrix.preset, 'linux')"
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          path-type: inherit
          install: mingw-w64-x86_64-clang lld mingw-w64-x86_64-lld mingw-w64-x86_64-gcc mingw-w64-x86_64-make

      - name: Setup MSVC
        if: contains(matrix.preset, 'msvc')
        uses: ilammy/msvc-dev-cmd@v1

      - name: Get CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Setup Compiler Cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          variant: sccache
          key: Windows-${{ matrix.preset }}-${{ matrix.build_type }}-unity-${{ matrix.unity_build }}
          max-size: 5G

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install jinja2

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Preflight
        run: |
          set -euo pipefail
          cmake --version
          dotnet --info
          if [[ "${{ matrix.preset }}" == *"clang"* ]]; then
            clang --version | head -n 1
          elif [[ "${{ matrix.preset }}" == *"msvc"* ]]; then
            cl || true
          elif [[ "${{ matrix.preset }}" == *"gcc"* ]]; then
            gcc --version | head -n 1
          fi

      - name: Configure
        run: |
          set -euo pipefail
          SANITIZERS_FLAG="OFF"
          # Disable ASan on Windows Clang due to static CRT conflicts (libucrtd.lib vs clang_rt.asan)
          mkdir -p "build/${{ matrix.preset }}"
          PYTHON_EXE=$(python -c "import sys; print(sys.executable)")

          cmake --preset ${{ matrix.preset }} \
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/install" \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -DPython_EXECUTABLE="${PYTHON_EXE}" \
            -DPython3_EXECUTABLE="${PYTHON_EXE}" \
            -DCH_CI=ON \
            -DENABLE_UNITY_BUILD=${{ matrix.unity_build }} \
            -DENABLE_SANITIZERS=$SANITIZERS_FLAG \
            -DENABLE_LTO=OFF \
            -DENABLE_PCH=ON \
            -DCH_COMPILE_JOBS=4 \
            2>&1 | tee "build/${{ matrix.preset }}/configure.log"

      - name: Build
        run: |
          set -euo pipefail
          cmake --build "build/${{ matrix.preset }}" --config ${{ matrix.build_type }} \
            2>&1 | tee "build/${{ matrix.preset }}/build_${{ matrix.build_type }}.log"

      - name: Test
        env:
          COREHOST_TRACE: 1
        run: |
          set -euo pipefail
          BUILD_DIR="${{ github.workspace }}/build/${{ matrix.preset }}"
          ctest --test-dir "$BUILD_DIR" -C "${{ matrix.build_type }}" --output-on-failure --timeout 300 --output-junit "$BUILD_DIR/junit_${{ matrix.build_type }}.xml" \
            2>&1 | tee "$BUILD_DIR/ctest_${{ matrix.build_type }}.log"

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-${{ matrix.preset }}-${{ matrix.build_type }}-binaries
          if-no-files-found: ignore
          path: |
            build/${{ matrix.preset }}/**/*.log
            build/${{ matrix.preset }}/**/junit_*.xml
            build/${{ matrix.preset }}/${{ matrix.build_type }}/*.exe
            build/${{ matrix.preset }}/${{ matrix.build_type }}/*.dll
          retention-days: 7